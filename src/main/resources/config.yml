settings:
  max-listings-per-player: 10
  listing-expiry-days: 7
  gui-rows: 6
  min-price: 1.0
  max-price: 1000000.0

market-fee:
  enabled: true
  listing-fee-percent: 0.0
  sale-fee-percent: 5.0
  minimum-fee: 0.0
  maximum-fee: 0.0
  # Opcjonalne konto Vault, na które trafia prowizja sprzedaży (puste = spalanie fee)
  sink-account: ""

history:
  # Bramkuje GUI /market history. Transakcje i tak są zapisywane (refund/ratings).
  enabled: true
  retention-days: 30

favorites:
  enabled: true

price-alerts:
  enabled: true
  max-per-player: 10

anti-abuse:
  enabled: true
  max-purchases-from-same-player: 20
  purchase-window-seconds: 86400
  max-transaction-value: 10000000
  listing-cooldown-seconds: 5

transactions:
  logging: true

mailbox:
  enabled: true

ratings:
  enabled: true

stats:
  enabled: true

